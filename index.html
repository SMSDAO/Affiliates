    <script>
      // Runtime suppression for Vite WebSocket / HMR close events in Cloud Run preview
      window.addEventListener('unhandledrejection', function(event) {
        var reason = event.reason;
        if (reason && (
          (reason.message && (reason.message.indexOf('WebSocket') !== -1 || reason.message.indexOf('vite') !== -1)) ||
          (reason.stack && reason.stack.indexOf('@vite/client') !== -1) ||
          String(reason).indexOf('WebSocket') !== -1
        )) {
          event.preventDefault();
          event.stopImmediatePropagation();
        }
      });
      window.addEventListener('error', function(event) {
        if (
          (event.message && event.message.indexOf('WebSocket') !== -1) ||
          (event.filename && event.filename.indexOf('@vite/client') !== -1)
        ) {
          event.preventDefault();
          event.stopImmediatePropagation();
        }
      });
    </script>
